<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 560" role="img" aria-labelledby="title desc"><title id="title">Volcano first ascent and Forge shortcut</title><desc id="desc">Water lava at entrance, take doors through floors one to four, refill on floor five, continue through six to nine, reach Forge on ten, then take southwest door and press the entry gate button.</desc><rect width="650" height="560" rx="12" fill="#faf7ee"/><g font-family="Arial,sans-serif" fill="#24372a"><text x="24" y="32" font-size="20" font-weight="bold">Volcano route / milestones, not a floor map</text><rect x="24" y="58" width="602" height="60" rx="8" fill="#e1ead6"/><text x="40" y="81" font-size="16" font-weight="bold">Entrance</text><text x="40" y="103" font-size="14">Refill on the west side; water a lava crossing.</text><text x="323" y="133" font-size="18">↓</text><rect x="24" y="135" width="602" height="60" rx="8" fill="#e1ead6"/><text x="40" y="158" font-size="16" font-weight="bold">Floors 1–4</text><text x="40" y="180" font-size="14">Find doors; activate every required gate pad.</text><text x="323" y="210" font-size="18">↓</text><rect x="24" y="212" width="602" height="60" rx="8" fill="#e1ead6"/><text x="40" y="235" font-size="16" font-weight="bold">Floor 5</text><text x="40" y="257" font-size="14">Water refill; optional parrot exit is one-way.</text><text x="323" y="287" font-size="18">↓</text><rect x="24" y="289" width="602" height="60" rx="8" fill="#e1ead6"/><text x="40" y="312" font-size="16" font-weight="bold">Floors 6–9</text><text x="40" y="334" font-size="14">Continue by doors; floor 9 contains a chest.</text><text x="323" y="364" font-size="18">↓</text><rect x="24" y="366" width="602" height="60" rx="8" fill="#e1ead6"/><text x="40" y="389" font-size="16" font-weight="bold">Floor 10 / Forge</text><text x="40" y="411" font-size="14">Use the southwest doorway after reaching the Forge.</text><text x="323" y="441" font-size="18">↓</text><rect x="24" y="443" width="602" height="60" rx="8" fill="#e1ead6"/><text x="40" y="466" font-size="16" font-weight="bold">Entrance gate button</text><text x="40" y="488" font-size="14">Open the direct return route for future Forge visits.</text><text x="24" y="542" font-size="13">Interior layouts vary. Keep healing and a usable return item.</text></g></svg>